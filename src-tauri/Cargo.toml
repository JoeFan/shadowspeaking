[package]
name = "shadowing-desktop-player-v2"
version = "3.5.0"
edition = "2021"

[lib]
name = "shadowing_desktop_player_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde_json = "1"
